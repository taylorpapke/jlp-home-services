<!DOCTYPE HTML>
<html>
	<head>
		<title>Get In Touch | JLP Home Services</title>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
		<link rel="stylesheet" href="assets/css/main.css" />
	</head>
	<body>
		<header class="site-header">
			<a href="index.html" class="site-logo"><img src="images/logo-white.png" alt="JLP Home Services logo"></a>
			<nav aria-label="Main navigation"><ul>
				<li><a href="index.html">Welcome</a></li>
				<li><a href="about.html">Who We Are</a></li>
				<li><a href="services.html">What We Do</a></li>
				<li><a href="contact.html" class="active">Get In Touch</a></li>
			</ul></nav>
		</header>
		<main id="wrapper">
			<section class="wrapper style2 page-section">
				<div class="inner contact-content">
					<h1 class="major">Get In Touch</h1>
					<p>Ready to get started on your project? Fill out the form below with details about your needs, and we’ll get back to you with a personalized quote.</p>
					<form class="quote-form" action="https://docs.google.com/forms/d/e/1FAIpQLScmQ910ZJ3uLYu-h00DMtsJ05PzB8NFdmK_rBTfQGvouToaNQ/formResponse" method="post" target="_blank">
						<div class="fields">
							<div class="field half">
								<label for="name">Name</label>
								<input type="text" id="name" name="entry.2005620554" placeholder="Your name" required>
							</div>
							<div class="field half">
								<label for="email">Email</label>
								<input type="email" id="email" name="entry.1045781291" placeholder="you@example.com" required>
							</div>
							<div class="field">
								<label for="comments">How can we help?</label>
								<textarea id="comments" name="entry.839337160" rows="7" placeholder="Tell us about your project" required></textarea>
							</div>
						</div>
						<ul class="actions">
							<li><button type="submit" class="button primary">Send Request</button></li>
						</ul>
					</form>
				</div>
			</section>
		</main>
		<footer id="footer" class="wrapper alt"><div class="inner"><ul class="menu"><li>&copy; 2025 JLP Home Services. All rights reserved.</li></ul></div></footer>
	</body>
</html>
